name: research-quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked project
        run: |
          python -m pip install uv==0.12.17
          uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest --cov=pqr --cov-report=term-missing --cov-fail-under=80
      - run: uv build
      - run: uv run pqr demo --output runs/ci-verification
      - run: uv run pqr verify-artifacts runs/ci-verification
